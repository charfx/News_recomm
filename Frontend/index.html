<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Quotidien</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-top">
      <span id="today" class="masthead-date"></span>
      <span id="user-email" class="masthead-user"></span>
    </div>
    <h1 class="masthead-title">Le Quotidien</h1>
  </header>

  <main class="container">
    <section class="section">
      <h2 class="section-title">Recommandé pour toi</h2>
      <div id="reco-list" class="grid grid-reco"></div>
    </section>

    <section class="section">
      <h2 class="section-title">À la une</h2>
      <div id="news-list" class="grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
