services:
  db:
            image: pgvector/pgvector:pg17
            container_name: news_db
            env_file: .env
            ports:
              - "5432:5432"
            volumes:
              - pgdata:/var/lib/postgresql/data
            healthcheck:
              test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
              interval: 5s
              retries: 10
            restart: unless-stopped
  frontend:
          build:
            context: ./Frontend
          container_name: news_frontend
          env_file: .env
          ports:
            - "5500:80"
          volumes:
            - ./Frontend:/usr/share/nginx/html:ro
          restart: unless-stopped
  backend:
          build:
            context: ./Backend
          container_name: news_backend
          env_file: .env
          environment:
            DATABASE_URL: postgresql+psycopg://news:news_pwd@db:5432/news_reco
          ports:
            - "8000:8000"
          depends_on:
            db:
              condition: service_healthy
          restart: unless-stopped  
volumes:
  pgdata:
    